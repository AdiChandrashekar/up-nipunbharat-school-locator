<body>
<title>Uttar Pradesh Nipun Bharat School Locator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
  :root{
    /* CSF palette */
    --blue:#003DA5; --navy:#00316B; --gold:#FFC000; --sky:#CFE2F3; --amber:#B26B00;
    --paper:#FFFFFF; --mist:#F4F7FB; --tint:#E4EEF8; --rule:#DDE3EC;
    --ink:#1B2433; --slate:#4A5568; --flat:#8A94A6; --critical:#B3261E;
    /* roles */
    --ground:#F4F7FB; --title:#00316B; --link:#003DA5;
    --action:#003DA5; --action-ink:#FFFFFF;
    --dot-r:#003DA5; --dot-u:#B26B00;
    --chip-on:#00316B; --chip-on-ink:#FFFFFF;
    --seg-on:#FFFFFF; --seg-on-ink:#00316B;
    --glass:rgba(255,255,255,.56); --glass-solid:rgba(255,255,255,.94); --sheet:rgba(250,252,255,.84);
    --panel:rgba(255,255,255,.74); --row-solid:#FAFCFE; --glass-edge:rgba(255,255,255,.9); --sheen:rgba(255,255,255,.6);
    --glass-shadow:0 12px 32px -10px rgba(0,49,107,.22),0 1px 3px rgba(0,49,107,.08);
    --panel-shadow:0 1px 2px rgba(0,49,107,.06),0 8px 24px -14px rgba(0,49,107,.18);
    --field:rgba(255,255,255,.84); --field-line:rgba(0,49,107,.14);
    --press:rgba(0,61,165,.06); --mark:rgba(255,192,0,.4); --crit-soft:rgba(179,38,30,.08);
    --wash-1:rgba(0,61,165,.18); --wash-2:rgba(207,226,243,1); --wash-3:rgba(255,192,0,.16);
    --scrim:rgba(0,34,77,.28); --toast:#00316B; --toast-ink:#FFFFFF;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#00162F; --title:#E4EEF8; --link:#8FB3E0;
      --ink:#E4EEF8; --slate:#A9B7CB; --flat:#8A94A6; --rule:rgba(207,226,243,.12); --tint:rgba(207,226,243,.08); --critical:#D9573B;
      --action:#2E63B8; --action-ink:#FFFFFF;
      --dot-r:#8FB3E0; --dot-u:#FFD666;
      --chip-on:#CFE2F3; --chip-on-ink:#00224D;
      --seg-on:rgba(207,226,243,.18); --seg-on-ink:#FFFFFF;
      --glass:rgba(0,34,77,.48); --glass-solid:rgba(0,34,77,.95); --sheet:rgba(0,30,66,.88);
      --panel:rgba(0,40,90,.38); --row-solid:#04213F; --glass-edge:rgba(207,226,243,.14); --sheen:rgba(255,255,255,.07);
      --glass-shadow:0 14px 36px -10px rgba(0,0,0,.6);
      --panel-shadow:0 10px 28px -16px rgba(0,0,0,.6);
      --field:rgba(0,22,47,.55); --field-line:rgba(207,226,243,.16);
      --press:rgba(207,226,243,.07); --mark:rgba(255,192,0,.3); --crit-soft:rgba(217,87,59,.14);
      --wash-1:rgba(46,99,184,.42); --wash-2:rgba(0,61,165,.3); --wash-3:rgba(255,192,0,.09);
      --scrim:rgba(0,8,20,.55); --toast:#CFE2F3; --toast-ink:#00224D;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#00162F; --title:#E4EEF8; --link:#8FB3E0;
    --ink:#E4EEF8; --slate:#A9B7CB; --flat:#8A94A6; --rule:rgba(207,226,243,.12); --tint:rgba(207,226,243,.08); --critical:#D9573B;
    --action:#2E63B8; --action-ink:#FFFFFF;
    --dot-r:#8FB3E0; --dot-u:#FFD666;
    --chip-on:#CFE2F3; --chip-on-ink:#00224D;
    --seg-on:rgba(207,226,243,.18); --seg-on-ink:#FFFFFF;
    --glass:rgba(0,34,77,.48); --glass-solid:rgba(0,34,77,.95); --sheet:rgba(0,30,66,.88);
    --panel:rgba(0,40,90,.38); --row-solid:#04213F; --glass-edge:rgba(207,226,243,.14); --sheen:rgba(255,255,255,.07);
    --glass-shadow:0 14px 36px -10px rgba(0,0,0,.6);
    --panel-shadow:0 10px 28px -16px rgba(0,0,0,.6);
    --field:rgba(0,22,47,.55); --field-line:rgba(207,226,243,.16);
    --press:rgba(207,226,243,.07); --mark:rgba(255,192,0,.3); --crit-soft:rgba(217,87,59,.14);
    --wash-1:rgba(46,99,184,.42); --wash-2:rgba(0,61,165,.3); --wash-3:rgba(255,192,0,.09);
    --scrim:rgba(0,8,20,.55); --toast:#CFE2F3; --toast-ink:#00224D;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
  body{margin:0; min-height:100vh; background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
  body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(70% 42% at 0% 0%,var(--wash-1),transparent 72%),
      radial-gradient(65% 40% at 100% 18%,var(--wash-2),transparent 70%),
      radial-gradient(60% 34% at 80% 100%,var(--wash-3),transparent 72%)}
  button,select,input{font:inherit; color:inherit}
  button{background:none; border:0; padding:0; cursor:pointer; text-align:inherit}
  .num{font-variant-numeric:tabular-nums}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  :focus-visible{outline:2.5px solid var(--gold); outline-offset:2px}
  .inner{max-width:720px; margin-inline:auto; padding-inline:16px}

  /* Liquid glass surface */
  .glass{background-color:var(--glass); background-image:linear-gradient(180deg,var(--sheen),transparent 42%);
    -webkit-backdrop-filter:blur(24px) saturate(175%); backdrop-filter:blur(24px) saturate(175%);
    border:1px solid var(--glass-edge); box-shadow:var(--glass-shadow),inset 0 1px 0 var(--sheen)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass{background-color:var(--glass-solid)}
  }

  /* ════════ MOBILE (base) ════════ */

  .top{padding-top:env(safe-area-inset-top)}
  .brandrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:14px 6px}
  .brand{display:flex; align-items:center; gap:11px; min-width:0}
  .logo{flex:0 0 auto; width:36px; height:36px; border-radius:9px; background:var(--navy); color:var(--gold); display:grid; place-items:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .wm{font-family:var(--serif); font-weight:600; font-size:22px; line-height:1.05; color:var(--title); letter-spacing:-.005em}
  .tag{font-size:13px; color:var(--slate); line-height:1.2; margin-top:3px; letter-spacing:.02em}
  .iconbtn{width:44px; height:44px; border-radius:10px; display:grid; place-items:center; color:var(--title)}

  .side{display:contents}
  .deskfilters{display:none}

  .dock{position:sticky; top:0; z-index:30; padding-block:6px 8px}
  .dockbar{border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:10px}
  .field{position:relative}
  .field > svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--flat); pointer-events:none}
  #q{width:100%; height:54px; border-radius:11px; border:1px solid var(--field-line); background:var(--field); color:var(--ink);
    font-size:17.5px; padding:0 50px 0 46px; -webkit-appearance:none; appearance:none}
  #q::placeholder{color:var(--flat)}
  #q::-webkit-search-cancel-button{display:none}
  #q:focus-visible{outline:2.5px solid var(--gold); outline-offset:0; border-color:transparent}
  .clear{position:absolute; right:5px; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:9px; display:grid; place-items:center; color:var(--slate)}
  .chips{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-inline:-10px; padding-inline:10px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; height:42px; padding:0 14px; border-radius:9px;
    background:var(--field); border:1px solid var(--field-line); font-size:15.5px; font-weight:500; white-space:nowrap; color:var(--ink)}
  .chip svg{flex:0 0 auto}
  .chip.on{background:var(--chip-on); border-color:var(--chip-on); color:var(--chip-on-ink)}
  .chip.busy{opacity:.65}
  .chip .badge{min-width:20px; height:20px; padding:0 6px; border-radius:5px; background:var(--gold); color:#00224D; font-size:12.5px; font-weight:600; display:inline-grid; place-items:center}
  .chip.tok{padding-right:6px; background:var(--tint); border-color:transparent; color:var(--title)}
  .chip.tok .xx{width:28px; height:28px; border-radius:6px; display:grid; place-items:center; color:var(--slate)}
  .divider{flex:0 0 1px; align-self:center; height:22px; background:var(--field-line)}

  main{padding-block:10px 28px; min-width:0}
  .lede{margin:8px 2px 18px; color:var(--slate); font-size:16px}
  .lede b{color:var(--ink); font-weight:600}
  .sh{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 2px 8px}
  .sh h2{margin:0; font-size:12.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--slate)}
  .sh .aside{font-size:13.5px; color:var(--flat)}
  .sh button.aside{color:var(--link); font-weight:500; padding:8px 0}
  .group{margin-bottom:24px}

  .list{list-style:none; margin:0; padding:0; background:var(--panel); border:1px solid var(--glass-edge); border-radius:12px; overflow:hidden; box-shadow:var(--panel-shadow)}
  .list > li + li{border-top:1px solid var(--rule)}

  .row{display:flex; align-items:center; gap:6px; padding-right:10px}
  .rowmain{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; padding:13px 6px 13px 15px; min-height:72px; justify-content:center}
  .rowmain:active{background:var(--press)}
  .nm{font-family:var(--serif); font-weight:600; font-size:17px; line-height:1.22; letter-spacing:.01em; color:var(--ink); overflow-wrap:anywhere}
  .sub{font-size:14.5px; color:var(--slate); line-height:1.3; display:flex; flex-wrap:wrap; column-gap:10px; row-gap:2px; align-items:center}
  .sub .code{color:var(--flat); font-variant-numeric:tabular-nums; letter-spacing:.02em}
  .km{font-weight:600; color:var(--title); font-variant-numeric:tabular-nums}
  .ar{display:inline-flex; align-items:center; gap:6px}
  .ar::before{content:""; flex:0 0 auto; width:8px; height:8px; border-radius:2px; background:var(--dot-r)}
  .ar.U::before{background:var(--dot-u)}
  .miss{color:var(--critical); font-weight:500}
  mark{background:var(--mark); color:inherit; border-radius:2px; padding:0 1px}
  .go{flex:0 0 auto; width:50px; height:50px; border-radius:11px; display:grid; place-items:center; background:var(--action); color:var(--action-ink);
    text-decoration:none; box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px -4px rgba(0,61,165,.5)}
  .go:active{transform:scale(.95)}
  .go.off{background:var(--tint); color:var(--slate); box-shadow:none}

  .nav button{width:100%; display:grid; grid-template-columns:1fr auto 16px; align-items:center; gap:12px; padding:0 14px 0 16px; min-height:56px}
  .nav button:active{background:var(--press)}
  .nav .t{font-size:17px; font-weight:500; line-height:1.25; padding-block:9px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .nav .t .ar{font-size:13.5px; font-weight:400; color:var(--slate)}
  .nav .c{font-size:15px; color:var(--slate); font-variant-numeric:tabular-nums}
  .nav .chev{color:var(--flat)}
  .nav .strong .t{color:var(--link); font-weight:600}
  .nav .pad{display:none}

  .crumb{margin:0 0 2px -8px}
  .back{display:inline-flex; align-items:center; gap:4px; font-size:16px; color:var(--link); font-weight:500; min-height:44px; padding:0 8px; border-radius:8px}
  .place{font-family:var(--serif); font-weight:600; font-size:30px; line-height:1.1; color:var(--title); margin:0 0 6px; text-wrap:balance}
  .placesub{margin:0 0 18px; color:var(--slate); font-size:15.5px; display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center}

  .count{margin:8px 2px 10px; font-size:15.5px; color:var(--slate); display:flex; flex-wrap:wrap; gap:4px 14px; align-items:baseline; justify-content:space-between}
  .count b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
  .linkbtn{color:var(--link); font-weight:500; min-height:40px; padding:0}

  .empty{background:var(--panel); border:1px solid var(--glass-edge); border-radius:12px; padding:30px 20px; text-align:center; color:var(--slate)}
  .empty h2{font-family:var(--serif); font-size:20px; font-weight:600; color:var(--title); margin:0 0 8px; text-wrap:balance}
  .empty p{margin:0 0 16px}
  .solid{display:inline-flex; align-items:center; height:48px; padding:0 20px; border-radius:10px; background:var(--action); color:var(--action-ink); font-weight:600}
  .loading{padding:40px 4px; color:var(--slate); display:flex; align-items:center; gap:12px}
  .spin{width:18px; height:18px; border-radius:50%; border:2px solid var(--rule); border-top-color:var(--blue); animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sentinel{height:1px}
  .morebtn{display:block; margin:12px auto 0; height:48px; padding:0 22px; border-radius:10px; background:var(--tint); color:var(--link); font-weight:600}

  .foot{padding-block:8px 40px; color:var(--flat); font-size:13.5px; display:flex; flex-direction:column; gap:8px}
  .foot p{margin:0}
  .foot .credit{font-size:14.5px; color:var(--slate)}
  .foot .credit a{color:var(--link); font-weight:600; text-decoration:none; border-bottom:1.5px solid var(--gold)}

  /* Sheet — mobile bottom sheet */
  .scrim{position:fixed; inset:0; z-index:50; background:var(--scrim); opacity:0; visibility:hidden; transition:opacity .22s, visibility 0s .22s}
  .scrim.open{opacity:1; visibility:visible; transition:opacity .22s}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:60; margin-inline:auto; max-width:600px; max-height:92vh; max-height:92dvh;
    display:flex; flex-direction:column; color:var(--ink); border-radius:16px 16px 0 0; border-bottom:0; background-color:var(--sheet);
    transform:translateY(105%); visibility:hidden; transition:transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s}
  .sheet.open{transform:none; visibility:visible; transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .grab{width:40px; height:5px; border-radius:3px; background:var(--field-line); margin:9px auto 2px; flex:0 0 auto}
  .shbody{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:4px 18px calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:16px}
  .shfoot{flex:0 0 auto; padding:12px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--rule)}
  .shfoot:not([hidden]) ~ .shbody, .sheet.hasfoot .shbody{padding-bottom:18px}
  .shtop{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:48px}
  .shtools{display:flex; align-items:center; gap:6px}
  .eyebrow{font-size:14.5px; color:var(--slate); min-width:0}
  .x{flex:0 0 auto; width:44px; height:44px; margin-right:-4px; border-radius:10px; display:grid; place-items:center; color:var(--slate); background:var(--tint)}
  .textbtn{height:44px; padding:0 12px; color:var(--link); font-weight:600; font-size:16px; border-radius:9px}
  .sname{font-family:var(--serif); font-weight:600; font-size:25px; line-height:1.15; color:var(--title); margin:-4px 0 0; text-wrap:balance; overflow-wrap:anywhere}
  .shh2{font-family:var(--serif); font-weight:600; font-size:24px; color:var(--title); margin:0}
  .facts{display:grid; grid-template-columns:auto 1fr; gap:10px 16px; margin:0; font-size:16px; background:var(--field); border:1px solid var(--field-line); border-radius:11px; padding:14px 15px}
  .facts dt{color:var(--flat); font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; padding-top:3px}
  .facts dd{margin:0; min-width:0; overflow-wrap:anywhere; font-variant-numeric:tabular-nums}
  .facts .coordrow{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
  .copy{flex:0 0 auto; height:38px; padding:0 12px; border-radius:8px; background:var(--tint); color:var(--link); font-size:14.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px}
  .primary{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:56px; border-radius:12px; background:var(--action); color:var(--action-ink);
    font-size:17.5px; font-weight:600; text-decoration:none; box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 18px -8px rgba(0,61,165,.55)}
  .primary:active{filter:brightness(.94)}
  .primary[disabled]{opacity:.5; cursor:not-allowed; box-shadow:none}
  .twin{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .secondary{display:flex; align-items:center; justify-content:center; gap:8px; height:52px; border-radius:11px; border:1px solid var(--field-line);
    background:var(--field); color:var(--link); font-size:16px; font-weight:600; text-decoration:none}
  .fine{margin:0; font-size:13.5px; color:var(--flat)}
  .warn{background:var(--crit-soft); color:var(--critical); border-radius:11px; padding:13px 15px; font-size:16px; font-weight:500}

  /* Filter form — mobile sizes */
  .fform{display:flex; flex-direction:column; gap:22px}
  .fgroup{display:flex; flex-direction:column; gap:8px}
  .flabel{font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--slate)}
  .selwrap{position:relative}
  .selwrap select{width:100%; height:56px; border-radius:11px; border:1px solid var(--field-line); background:var(--field); color:var(--ink);
    font-size:17.5px; padding:0 44px 0 15px; -webkit-appearance:none; appearance:none; text-overflow:ellipsis}
  .selwrap select:disabled{color:var(--flat); opacity:1}
  .selwrap select option{color:#1B2433; background:#FFFFFF}
  .selwrap svg{position:absolute; right:15px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--slate)}
  .seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:3px; padding:4px; border-radius:12px; background:var(--tint); border:1px solid var(--field-line)}
  .seg button{min-height:48px; border-radius:8px; font-size:16px; font-weight:500; color:var(--slate); text-align:center; padding:4px 6px; line-height:1.15}
  .seg button[aria-pressed="true"]{background:var(--seg-on); color:var(--seg-on-ink); font-weight:600; box-shadow:0 1px 3px rgba(0,49,107,.16),inset 0 1px 0 var(--sheen)}

  #toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:80; transform:translate(-50%,14px); opacity:0; pointer-events:none;
    background:var(--toast); color:var(--toast-ink); padding:12px 18px; border-radius:11px; font-size:15.5px; font-weight:500; width:max-content; max-width:calc(100vw - 32px); text-align:center;
    transition:opacity .2s, transform .2s; box-shadow:0 10px 30px -8px rgba(0,34,77,.45)}
  #toast.show{opacity:1; transform:translate(-50%,0)}

  /* ════════ DESKTOP ════════ */
  @media (min-width:960px){
    .inner{max-width:1200px; padding-inline:32px}
    .brandrow{padding-block:28px 20px}
    .logo{width:40px; height:40px; border-radius:10px}
    .wm{font-size:27px}
    .tag{font-size:13.5px}
    .iconbtn{width:40px; height:40px}

    .sheet{top:50%; bottom:auto; left:50%; right:auto; width:520px; max-height:86vh; border-radius:14px; border-bottom:1px solid var(--glass-edge);

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var view=$('view');
  var D=window.NIPUN_DATA;
  if(!D){view.innerHTML='<div class="empty"><h2>School data didn’t load</h2><p>Keep schools_data.js in the same folder as this page, then reload.</p></div>';return;}

  var districts=D.districts, blocks=D.blocks, dblocks=D.districtBlocks, S=D.schools, N=S.length;
  var PAGE=40, RECENT_MAX=8;
  var mqDesk=window.matchMedia('(min-width: 960px)');

  var ICON={
    nav:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.3 2.7a.9.9 0 0 0-1-.2L3.1 9.6a.9.9 0 0 0 .1 1.7l7 2 2 7a.9.9 0 0 0 1.7.1l7.1-17.2a.9.9 0 0 0-.2-1z"/></svg>',
    search:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg>',
    chev:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
    down:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
    x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    xs:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    copy:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    pin:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.6-7-11a7 7 0 0 1 14 0c0 4.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
    share:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
    sun:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2 12h2.2M19.8 12H22M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>',
    moon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></svg>'
  };

  // ── helpers
  var fmt=function(n){return n.toLocaleString('en-IN');};
  function tc(s){return s.toLowerCase().replace(/(^|[\s\-(])([a-z])/g,function(m,a,b){return a+b.toUpperCase();});}
  function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function sget(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function sset(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
  function top(){window.scrollTo(0,0);}

  // ── index
  var dName=districts.map(tc), dN=districts.map(norm), bN=blocks.map(norm);
  var bArea=blocks.map(function(r){return /\(U\)\s*$/.test(r)?'U':(/\(R\)\s*$/.test(r)?'R':'');});
  var bLabel=blocks.map(function(r){return r.replace(/\s*\((R|U)\)\s*$/,'');});
  var AREA={R:'Rural',U:'Urban'};
  var nameN=new Array(N), hay=new Array(N), dTotal=new Array(districts.length).fill(0);
  for(var i=0;i<N;i++){
    var s=S[i], n=norm(s[0]);
    dTotal[s[2]]++;
    nameN[i]=n; hay[i]=n+' | '+bN[s[3]]+' | '+dN[s[2]]+' | '+s[1];
  }
  var dOrder=districts.map(function(_,i){return i;}).sort(function(a,b){return dName[a].localeCompare(dName[b]);});
  var uMap=null;
  function byUdise(u){if(!uMap){uMap={};for(var i=0;i<N;i++)uMap[S[i][1]]=i;}return uMap[u];}
  function hasC(s){return !!(s[4]&&s[5]);}
  function dirUrl(s){return 'https://www.google.com/maps/dir/?api=1&destination='+s[4]+'%2C'+s[5];}
  function mapUrl(s){return 'https://www.google.com/maps/search/?api=1&query='+s[4]+'%2C'+s[5];}
  function nameSearchUrl(s){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((s[0]||'')+' school '+bLabel[s[3]]+' '+dName[s[2]]+' Uttar Pradesh');}

  // ── state
  var st={q:'',d:-1,b:-1,area:'',coord:'',near:null,list:false};
  (function loadFilters(){
    var f; try{f=JSON.parse(sget('nipun-filters')||'null');}catch(e){f=null;}
    if(!f||typeof f!=='object')return;
    if(f.d>=0&&f.d<districts.length){st.d=f.d; if(f.b>=0&&(dblocks[f.d]||[]).indexOf(f.b)!==-1)st.b=f.b;}
    if(f.area==='R'||f.area==='U')st.area=f.area;
    if(f.coord==='has'||f.coord==='none')st.coord=f.coord;
  })();
  function saveFilters(){sset('nipun-filters',JSON.stringify({d:st.d,b:st.b,area:st.area,coord:st.coord}));}
  function nFilters(f){return (f.d>=0?1:0)+(f.b>=0?1:0)+(f.area?1:0)+(f.coord?1:0);}
  var lastResults=[];

  function match(s,f){
    if(f.d>=0&&s[2]!==f.d)return false;
    if(f.b>=0&&s[3]!==f.b)return false;
    if(f.area&&bArea[s[3]]!==f.area)return false;
    if(f.coord==='has'&&!hasC(s))return false;
    if(f.coord==='none'&&hasC(s))return false;
    return true;
  }

  function km(i){
    var s=S[i]; if(!st.near||!hasC(s))return Infinity;
    var R=6371, toR=Math.PI/180, dLa=(s[4]-st.near.lat)*toR, dLo=(s[5]-st.near.lng)*toR;
    var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(st.near.lat*toR)*Math.cos(s[4]*toR)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.sqrt(a));
  }
  function fmtKm(d){return d<1?Math.round(d*1000)+' m':(d<10?d.toFixed(1):Math.round(d))+' km';}
  function byDist(idx){return idx.map(function(i){return [km(i),i];}).sort(function(a,b){return a[0]-b[0];}).map(function(p){return p[1];});}

  function search(f,q){
    q=norm(q);
    var toks=q.split(' ').filter(Boolean), b0=[], b1=[], b2=[], digits=/^\d{3,}$/.test(q);
    for(var i=0;i<N;i++){
      var s=S[i];
      if(!match(s,f))continue;
      if(!q){b0.push(i);continue;}
      if(digits){
        var u=s[1];
        if(u.indexOf(q)===0)b0.push(i); else if(u.indexOf(q)!==-1)b2.push(i); else if(nameN[i].indexOf(q)!==-1)b1.push(i);
        continue;
      }
      var h=hay[i], ok=true, t;
      for(t=0;t<toks.length;t++){if(h.indexOf(toks[t])===-1){ok=false;break;}}
      if(!ok)continue;
      var n=nameN[i];
      if(n.indexOf(q)===0){b0.push(i);continue;}
      var sp=' '+n, inName=true;
      for(t=0;t<toks.length;t++){if(sp.indexOf(' '+toks[t])===-1){inName=false;break;}}
      (inName?b1:b2).push(i);
    }
    return b0.concat(b1,b2);
  }
  function countFor(f,q){
    if(norm(q))return search(f,q).length;
    var c=0; for(var i=0;i<N;i++)if(match(S[i],f))c++; return c;
  }
  function nearest(lim){
    var la=st.near.lat, lo=st.near.lng, boxes=[.12,.5,2,99], c=[];
    for(var w=0;w<boxes.length;w++){
      c=[]; var bw=boxes[w];
      for(var i=0;i<N;i++){var s=S[i]; if(!hasC(s)||!match(s,st))continue; if(Math.abs(s[4]-la)>bw||Math.abs(s[5]-lo)>bw)continue; c.push(i);}
      if(c.length>=lim)break;
    }
    return byDist(c).slice(0,lim);
  }

  function hl(text,toks){
    var e=esc(text);
    if(!toks||!toks.length)return e;
    var pat=toks.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).sort(function(a,b){return b.length-a.length;}).join('|');
    return pat?e.replace(new RegExp('('+pat+')','gi'),'<mark>$1</mark>'):e;
  }

  // ── rows
  function rowHTML(i,toks){
    var s=S[i], c=hasC(s), a=bArea[s[3]], nm=s[0]||'Unnamed school';
    var dist=(st.near&&c)?'<span class="km">'+fmtKm(km(i))+'</span>':'';
    return '<li class="row"><button class="rowmain" data-i="'+i+'">'+
      '<span class="nm">'+hl(nm,toks)+'</span>'+
      '<span class="sub">'+dist+'<span class="ar'+(a==='U'?' U':'')+'">'+esc(bLabel[s[3]])+' · '+esc(dName[s[2]])+'</span>'+
        '<span class="code">'+hl(s[1],toks)+'</span>'+(c?'':'<span class="miss">No location</span>')+'</span>'+
      '</button>'+
      (c?'<a class="go" href="'+dirUrl(s)+'" target="_blank" rel="noopener" aria-label="Directions to '+esc(nm)+'">'+ICON.nav+'</a>'
        :'<a class="go off" href="'+nameSearchUrl(s)+'" target="_blank" rel="noopener" aria-label="No coordinates on record — search '+esc(nm)+' on Google Maps">'+ICON.search+'</a>')+
      '</li>';
  }
  var io=null;
  function mountList(container,idx,toks){
    var ul=document.createElement('ul'), pos=0, sent=document.createElement('div');
    ul.className='list'; container.appendChild(ul); sent.className='sentinel';
    function more(){
      var end=Math.min(idx.length,pos+PAGE), h='';
      for(;pos<end;pos++)h+=rowHTML(idx[pos],toks);
      ul.insertAdjacentHTML('beforeend',h);
      if(pos>=idx.length){if(io){io.disconnect();io=null;} sent.remove();}
    }
    more();
    if(pos<idx.length){
      container.appendChild(sent);
      if('IntersectionObserver' in window){
        io=new IntersectionObserver(function(en){if(en[0].isIntersecting)more();},{rootMargin:'800px 0px'});
        io.observe(sent);
      }else{
        sent.className=''; sent.innerHTML='<button class="morebtn">Show more</button>';
        sent.firstChild.addEventListener('click',more);
      }
    }
  }

  // ── views
  function summary(){
    var p=[];
    p.push(st.d<0?'Uttar Pradesh':dName[st.d]);
    if(st.b>=0)p.push(bLabel[st.b]);
    if(st.area)p.push(AREA[st.area]);
    if(st.coord)p.push(st.coord==='has'?'Has location':'Missing location');
    return p.join(' · ');
  }
  function clearFiltersBtn(){return nFilters(st)?'<button class="linkbtn" data-act="clear-filters">Clear filters</button>':'';}

  function render(){
    if(io){io.disconnect();io=null;}
    view.innerHTML=''; lastResults=[];
    if(st.q.trim())viewResults(true);
    else if(st.near)viewNearby();
    else if(st.d>=0&&(st.b>=0||st.list))viewSchoolList();
    else if(st.d>=0)viewDistrict();
    else if(st.area||st.coord)viewResults(false);
    else viewHome();
    syncChrome();
  }

  function viewHome(){
    view.insertAdjacentHTML('beforeend','<p class="lede"><b class="num">'+fmt(N)+'</b> government schools across <b>75</b> districts. Search, filter, or open a district.</p>');
    var rec=recent();
    if(rec.length){
      var g=document.createElement('div'); g.className='group';
      g.innerHTML='<div class="sh"><h2>Recently opened</h2><button class="aside" data-act="clear-recent">Clear</button></div>';
      view.appendChild(g); mountList(g,rec,null);
    }
    var counts=new Array(districts.length).fill(0);
    for(var i=0;i<N;i++)counts[S[i][2]]++;
    var list='';
    dOrder.forEach(function(d){
      list+='<li><button data-d="'+d+'"><span class="t">'+esc(dName[d])+'</span><span class="c">'+fmt(counts[d])+'</span><span class="chev">'+ICON.chev+'</span></button></li>';
    });
    view.insertAdjacentHTML('beforeend','<div class="group"><div class="sh"><h2>Districts</h2><span class="aside">schools</span></div><ul class="list nav cols">'+list+'</ul></div>');
  }

  function viewDistrict(){
    var d=st.d, total=0, bc={};
    for(var i=0;i<N;i++){var s=S[i]; if(match(s,st)){total++; bc[s[3]]=(bc[s[3]]||0)+1;}}
    var bl=(dblocks[d]||[]).filter(function(b){return bc[b];}).sort(function(a,b){return bLabel[a].localeCompare(bLabel[b]);});
    view.insertAdjacentHTML('beforeend',
      '<div class="crumb"><button class="back" data-nav="home">'+ICON.back+'All districts</button></div>'+
      '<h1 class="place">'+esc(dName[d])+'</h1>'+
      '<p class="placesub"><span class="num">'+fmt(total)+' schools · '+bl.length+' blocks & towns'+(st.area||st.coord?' · filtered':'')+'</span>'+clearFiltersBtn()+'</p>');
    if(!total){view.insertAdjacentHTML('beforeend','<div class="empty"><h2>No schools with these filters</h2><p>'+esc(summary())+'</p><button class="solid" data-act="clear-filters">Clear filters</button></div>');return;}
    var list='<li class="strong"><button data-act="list"><span class="t">All schools in '+esc(dName[d])+'</span><span class="c">'+fmt(total)+'</span><span class="chev">'+ICON.chev+'</span></button></li>';
    bl.forEach(function(b){
      var a=bArea[b];
      list+='<li><button data-b="'+b+'"><span class="t">'+esc(bLabel[b])+(a?'<span class="ar'+(a==='U'?' U':'')+'">'+AREA[a]+'</span>':'')+'</span><span class="c">'+fmt(bc[b])+'</span><span class="chev">'+ICON.chev+'</span></button></li>';
    });
    // even-numbered 2-col grid on desktop: pad with an empty cell if needed
    if(bl.length%2===1)list+='<li aria-hidden="true" class="pad"></li>';
    view.insertAdjacentHTML('beforeend','<div class="group"><div class="sh"><h2>Blocks & towns</h2><span class="aside">schools</span></div><ul class="list nav cols2">'+list+'</ul></div>');
  }

  function viewSchoolList(){
    var idx=search(st,''); lastResults=idx;
    var title=st.b>=0?bLabel[st.b]:'All schools';
    view.insertAdjacentHTML('beforeend',
      '<div class="crumb"><button class="back" data-nav="district">'+ICON.back+esc(dName[st.d])+'</button></div>'+
      '<h1 class="place">'+esc(title)+'</h1>'+
      '<p class="placesub"><span class="num">'+fmt(idx.length)+' schools · '+esc(summary())+'</span>'+clearFiltersBtn()+'</p>');
    if(!idx.length){view.insertAdjacentHTML('beforeend','<div class="empty"><h2>No schools with these filters</h2><button class="solid" data-act="clear-filters">Clear filters</button></div>');return;}
    mountList(view,idx,null);
  }

  // Districts whose name matches the query ("luck", "gautam budh", "kanpurnagar")
  function matchDistricts(q){
    var qn=norm(q); if(qn.length<2||/^\d+$/.test(qn))return [];
    var qc=qn.replace(/ /g,'');
    return dOrder.filter(function(d){
      return (' '+dN[d]).indexOf(' '+qn)!==-1||dN[d].replace(/ /g,'').indexOf(qc)===0;
    }).slice(0,4);
  }

  function viewResults(withQuery){
    var q=withQuery?st.q:'', idx=search(st,q), toks=norm(q).split(' ').filter(Boolean);
    if(st.near)idx=byDist(idx);
    lastResults=idx;
    var dm=(withQuery&&st.d<0)?matchDistricts(q):[];
    if(dm.length){
      var dl='';
      dm.forEach(function(d){
        dl+='<li><button data-dq="'+d+'"><span class="t">'+hl(dName[d],toks)+'</span><span class="c">'+fmt(dTotal[d])+' schools</span><span class="chev">'+ICON.chev+'</span></button></li>';
      });
      view.insertAdjacentHTML('beforeend','<div class="group"><div class="sh"><h2>'+(dm.length===1?'District':'Districts')+'</h2><span class="aside">tap to open</span></div><ul class="list nav">'+dl+'</ul></div>');
    }
    if(!idx.length&&dm.length)return;
    if(!idx.length){
      var filtered=nFilters(st)>0;
      view.innerHTML='<div class="empty"><h2>'+(withQuery?'No school matches “'+esc(st.q.trim())+'”':'No schools with these filters')+'</h2><p>'+
        (filtered?'Filters: '+esc(summary())+'. The school may sit outside them.':'Check the spelling, try fewer words, or use the 11-digit UDISE code.')+'</p>'+
        (filtered?'<button class="solid" data-act="clear-filters">Clear filters</button>':'')+'</div>';
      return;
    }
    view.insertAdjacentHTML('beforeend','<p class="count"><span><b>'+fmt(idx.length)+'</b> '+(idx.length===1?'school':'schools')+' · '+esc(summary())+(st.near?' · nearest first':'')+'</span>'+clearFiltersBtn()+'</p>');
    mountList(view,idx,toks);
  }

  function viewNearby(){
    var idx=st.coord==='none'?[]:nearest(60); lastResults=idx;
    if(!idx.length){view.innerHTML='<div class="empty"><h2>No nearby schools with these filters</h2><p>'+esc(summary())+'</p><button class="solid" data-act="clear-filters">Clear filters</button></div>';return;}
    view.insertAdjacentHTML('beforeend','<p class="count"><span><b>'+idx.length+'</b> nearest schools · '+esc(summary())+'</span><button class="linkbtn" data-act="near-off">Turn off Nearby</button></p>');
    mountList(view,idx,null);
  }

  function syncChrome(){
    var nf=nFilters(st), b=$('fBadge');
    b.hidden=!nf; b.textContent=nf;
    $('nearBtn').classList.toggle('on',!!st.near);
    $('nearBtn').setAttribute('aria-pressed',st.near?'true':'false');
    $('clear').hidden=!st.q;
    $('q').placeholder=st.b>=0?'Search in '+bLabel[st.b]:(st.d>=0?'Search in '+dName[st.d]:'School, UDISE, block or district');
    var t='';
    if(nf)t+='<span class="divider" aria-hidden="true"></span>';
    if(st.d>=0)t+=tok('d',dName[st.d]);
    if(st.b>=0)t+=tok('b',bLabel[st.b]);
    if(st.area)t+=tok('area',AREA[st.area]);
    if(st.coord)t+=tok('coord',st.coord==='has'?'Has location':'Missing location');
    $('tokens').innerHTML=t;
    syncForm($('deskFilters'),'k',st);
    $('dReset').hidden=!nf;
  }
  function tok(k,label){return '<button class="chip tok" data-untok="'+k+'" aria-label="Remove filter: '+esc(label)+'">'+esc(label)+'<span class="xx">'+ICON.xs+'</span></button>';}

  // ── recent
  function recent(){
    var raw; try{raw=JSON.parse(sget('nipun-recent')||'[]');}catch(e){raw=[];}
    if(!Array.isArray(raw))return [];
    return raw.map(byUdise).filter(function(i){return i!==undefined;});
  }
  function pushRecent(i){
    var u=S[i][1], raw; try{raw=JSON.parse(sget('nipun-recent')||'[]');}catch(e){raw=[];}
    if(!Array.isArray(raw))raw=[];
    raw=raw.filter(function(x){return x!==u;}); raw.unshift(u);
    sset('nipun-recent',JSON.stringify(raw.slice(0,RECENT_MAX)));
  }

  // ── filter form (shared by the mobile sheet and the desktop sidebar)
  function formHTML(p){
    return '<div class="fform">'+
      '<div class="fgroup"><label class="flabel" for="'+p+'D">District</label><div class="selwrap"><select id="'+p+'D"></select>'+ICON.down+'</div></div>'+
      '<div class="fgroup"><label class="flabel" for="'+p+'B">Block or town</label><div class="selwrap"><select id="'+p+'B"></select>'+ICON.down+'</div></div>'+
      '<div class="fgroup"><span class="flabel" id="'+p+'lA">Area</span><div class="seg" role="group" aria-labelledby="'+p+'lA" data-seg="area">'+
        '<button type="button" data-v="">All</button><button type="button" data-v="R">Rural</button><button type="button" data-v="U">Urban</button></div></div>'+
      '<div class="fgroup"><span class="flabel" id="'+p+'lC">Location on record</span><div class="seg" role="group" aria-labelledby="'+p+'lC" data-seg="coord">'+
        '<button type="button" data-v="">All</button><button type="button" data-v="has">Has location</button><button type="button" data-v="none">Missing</button></div></div>'+
    '</div>';
  }
  var districtOptions=(function(){var o='<option value="-1">All districts</option>';dOrder.forEach(function(d){o+='<option value="'+d+'">'+esc(dName[d])+'</option>';});return o;})();
  function fillBlockSelect(sel,f){
    var key=f.d+'|'+f.area;
    if(sel._key!==key){
      sel._key=key;
      if(f.d<0){sel.innerHTML='<option value="-1">Choose a district first</option>';}
      else{
        var bl=(dblocks[f.d]||[]).filter(function(b){return !f.area||bArea[b]===f.area;}).sort(function(a,b){return bLabel[a].localeCompare(bLabel[b]);});
        var o='<option value="-1">All blocks & towns</option>';
        bl.forEach(function(b){o+='<option value="'+b+'">'+esc(bLabel[b])+(bArea[b]?' ('+AREA[bArea[b]]+')':'')+'</option>';});
        sel.innerHTML=o;
      }
    }
    sel.disabled=f.d<0;
  }
  function syncForm(root,p,f){
    if(!root)return;
    var dSel=root.querySelector('#'+p+'D'), bSel=root.querySelector('#'+p+'B');
    if(!dSel)return;
    dSel.value=String(f.d);
    fillBlockSelect(bSel,f);
    bSel.value=String(f.b);
    root.querySelectorAll('[data-seg]').forEach(function(g){
      var k=g.dataset.seg;
      g.querySelectorAll('button').forEach(function(bt){bt.setAttribute('aria-pressed',bt.dataset.v===f[k]?'true':'false');});
    });
  }
  function bindForm(root,p,f,changed){
    root.querySelector('#'+p+'D').innerHTML=districtOptions;
    root.querySelector('#'+p+'D').addEventListener('change',function(){f.d=+this.value; f.b=-1; changed();});
    root.querySelector('#'+p+'B').addEventListener('change',function(){f.b=+this.value; changed();});
    root.addEventListener('click',function(e){
      var t=e.target.closest('.seg button'); if(!t)return;
      var k=t.parentNode.dataset.seg;
      f[k]=t.dataset.v;
      if(k==='area'&&f.b>=0&&f.area&&bArea[f.b]!==f.area)f.b=-1;
      changed();
    });
    syncForm(root,p,f);
  }

  // Desktop sidebar: filters apply immediately
  (function initDesk(){
    var root=$('deskFilters');
    root.innerHTML='<div class="dfhead"><h2>Filters</h2><button class="textbtn" id="dReset" hidden>Reset</button></div>'+formHTML('k');
    bindForm(root,'k',st,function(){st.list=false; saveFilters(); render(); top();});
    $('dReset').addEventListener('click',function(){st.d=-1; st.b=-1; st.area=''; st.coord=''; st.list=false; saveFilters(); render();});
  })();

  // ── sheet
  var sheet=$('sheet'), scrim=$('scrim'), shbody=$('shbody'), shfoot=$('shfoot'), pushed=false, returnFocus=null, draft=null;
  function openSheet(html,foot){
    shbody.innerHTML=html; shbody.scrollTop=0;
    shfoot.innerHTML=foot||''; shfoot.hidden=!foot;
    if(!sheet.classList.contains('open')){
      returnFocus=document.activeElement;
      try{history.pushState({sheet:1},'');pushed=true;}catch(e){pushed=false;}
    }
    sheet.classList.add('open'); scrim.classList.add('open');
    var f=sheet.querySelector('[data-focus]'); if(f)setTimeout(function(){f.focus({preventScroll:true});},60);
  }
  function closeSheet(fromPop){
    if(!sheet.classList.contains('open'))return;
    sheet.classList.remove('open'); scrim.classList.remove('open'); draft=null;
    if(pushed&&!fromPop){pushed=false;try{history.back();}catch(e){}}else pushed=false;
    if(returnFocus&&returnFocus.focus&&returnFocus!==$('q'))try{returnFocus.focus({preventScroll:true});}catch(e){}
  }
  window.addEventListener('popstate',function(){closeSheet(true);});

  function openSchool(i){
    var s=S[i], c=hasC(s), a=bArea[s[3]], nm=s[0]||'Unnamed school';
    pushRecent(i);
    var h='<div class="shtop"><div class="eyebrow">'+esc(dName[s[2]])+' › '+esc(bLabel[s[3]])+'</div><button class="x" data-close aria-label="Close">'+ICON.x+'</button></div>'+
      '<h2 class="sname" id="sheetTitle">'+esc(nm)+'</h2>'+
      '<dl class="facts">'+
        '<dt>UDISE</dt><dd>'+esc(s[1]||'—')+'</dd>'+
        (a?'<dt>Area</dt><dd><span class="ar'+(a==='U'?' U':'')+'">'+AREA[a]+'</span></dd>':'')+
        (c?'<dt>Location</dt><dd class="coordrow"><span>'+s[4].toFixed(6)+'° N, '+s[5].toFixed(6)+'° E</span><button class="copy" data-copy="'+s[4]+','+s[5]+'">'+ICON.copy+'Copy</button></dd>':'')+
        (st.near&&c?'<dt>Distance</dt><dd>'+fmtKm(km(i))+' from you</dd>':'')+
      '</dl>';
    if(c){
      h+='<a class="primary" data-focus href="'+dirUrl(s)+'" target="_blank" rel="noopener">'+ICON.nav+'Get directions</a>'+
         '<div class="twin"><a class="secondary" href="'+mapUrl(s)+'" target="_blank" rel="noopener">'+ICON.pin+'Show on map</a>'+
         '<button class="secondary" data-share="'+i+'">'+ICON.share+'Share</button></div>'+
         '<p class="fine">The Nipun Plus app draws a 100 m geofence around this point.</p>';
    }else{
      h+='<div class="warn">This school has no coordinates on record.</div>'+
         '<a class="primary" data-focus href="'+nameSearchUrl(s)+'" target="_blank" rel="noopener">'+ICON.search+'Search it on Google Maps</a>';
    }
    openSheet(h,'');
  }

  // Mobile filter sheet: edit a draft, apply with the pinned button
  function openFilters(){
    draft={d:st.d,b:st.b,area:st.area,coord:st.coord};
    openSheet(
      '<div class="shtop"><h2 class="shh2" id="sheetTitle">Filters</h2><div class="shtools"><button class="textbtn" data-freset>Reset</button><button class="x" data-close aria-label="Close">'+ICON.x+'</button></div></div>'+
      '<div id="fwrap">'+formHTML('f')+'</div>',
      '<button class="primary" id="fApply" data-focus>Show schools</button>'
    );
    var d=draft;
    bindForm($('fwrap'),'f',d,function(){syncForm($('fwrap'),'f',d); syncApply();});
    syncApply();
  }
  function syncApply(){
    if(!draft)return;
    var n=countFor(draft,st.q), btn=$('fApply');
    btn.disabled=!n;
    btn.textContent=n?'Show '+fmt(n)+(n===1?' school':' schools'):'No schools match';
  }

  // ── actions
  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2000);}
  function copy(text,msg){
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(msg);},function(){fallbackCopy(text,msg);});}
    else fallbackCopy(text,msg);
  }
  function fallbackCopy(text,msg){
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast(msg);}catch(e){toast('Copying isn’t allowed here');}
    document.body.removeChild(ta);
  }
  function share(i){
    var s=S[i], url=mapUrl(s);
    var text=(s[0]||'School')+'\n'+bLabel[s[3]]+', '+dName[s[2]]+'\nUDISE '+s[1]+'\n'+url;
    if(navigator.share){navigator.share({title:s[0],text:text}).catch(function(){});}
    else copy(text,'School details copied — paste to share');
  }

  view.addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t)return;
    if(t.dataset.i!==undefined){openSchool(+t.dataset.i);return;}
    if(t.dataset.d!==undefined){st.d=+t.dataset.d; st.b=-1; st.list=false; saveFilters(); render(); top(); return;}
    if(t.dataset.dq!==undefined){st.d=+t.dataset.dq; st.b=-1; st.list=false; st.q=''; qin.value=''; saveFilters(); render(); top(); return;}
    if(t.dataset.b!==undefined){st.b=+t.dataset.b; saveFilters(); render(); top(); return;}
    if(t.dataset.nav==='home'){st.d=-1; st.b=-1; st.list=false; saveFilters(); render(); top(); return;}
    if(t.dataset.nav==='district'){st.b=-1; st.list=false; saveFilters(); render(); top(); return;}
    var a=t.dataset.act;
    if(a==='list'){st.list=true; render(); top();}
    else if(a==='clear-filters'){st.d=-1; st.b=-1; st.area=''; st.coord=''; st.list=false; saveFilters(); render(); toast('Filters cleared');}
    else if(a==='near-off'){st.near=null; render();}
    else if(a==='clear-recent'){sset('nipun-recent',null); render(); toast('Recent schools cleared');}
  });

  sheet.addEventListener('click',function(e){
    var t=e.target.closest('button,a'); if(!t)return;
    if(t.hasAttribute('data-close')){closeSheet();return;}
    if(t.dataset.copy){copy(t.dataset.copy,'Coordinates copied');return;}
    if(t.dataset.share!==undefined){share(+t.dataset.share);return;}
    if(t.id==='fApply'&&draft){
      st.d=draft.d; st.b=draft.b; st.area=draft.area; st.coord=draft.coord; st.list=false;
      saveFilters(); closeSheet(); render(); top(); return;
    }
    if(t.hasAttribute('data-freset')&&draft){
      draft.d=-1; draft.b=-1; draft.area=''; draft.coord='';
      syncForm($('fwrap'),'f',draft); syncApply();
    }
  });
  scrim.addEventListener('click',function(){closeSheet();});
  $('filterBtn').addEventListener('click',openFilters);
  $('tokens').addEventListener('click',function(e){
    var t=e.target.closest('[data-untok]'); if(!t)return;
    var k=t.dataset.untok;
    if(k==='d'){st.d=-1; st.b=-1; st.list=false;}
    else if(k==='b'){st.b=-1;}
    else st[k]='';
    saveFilters(); render();
  });

  var qin=$('q'), deb;
  qin.addEventListener('input',function(){
    $('clear').hidden=!qin.value;
    clearTimeout(deb);
    deb=setTimeout(function(){st.q=qin.value; render(); top();},110);
  });
  qin.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    clearTimeout(deb); st.q=qin.value; render();
    var q=norm(st.q);
    if(lastResults.length===1||(/^\d{11}$/.test(q)&&lastResults.length&&S[lastResults[0]][1]===q))openSchool(lastResults[0]);
    if(!mqDesk.matches)qin.blur();
  });
  $('clear').addEventListener('click',function(){qin.value=''; st.q=''; render(); qin.focus();});
  $('main').addEventListener('touchmove',function(){if(document.activeElement===qin)qin.blur();},{passive:true});

  $('nearBtn').addEventListener('click',function(){
    var btn=this;
    if(st.near){st.near=null; render(); return;}
    if(!navigator.geolocation){toast('This browser can’t share your location');return;}
    btn.classList.add('busy'); $('nearLbl').textContent='Locating…';
    navigator.geolocation.getCurrentPosition(function(p){
      btn.classList.remove('busy'); $('nearLbl').textContent='Nearby';
      st.near={lat:p.coords.latitude,lng:p.coords.longitude}; render(); top();
    },function(err){
      btn.classList.remove('busy'); $('nearLbl').textContent='Nearby';
      toast(err.code===1?'Location is blocked — allow it, or search by name':'Couldn’t find your location — try again');
    },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
  });

  // Switching between phone and desktop widths: close the mobile filter sheet if it's open
  var onMq=function(){if(mqDesk.matches&&draft)closeSheet();};
  if(mqDesk.addEventListener)mqDesk.addEventListener('change',onMq); else if(mqDesk.addListener)mqDesk.addListener(onMq);

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&sheet.classList.contains('open')){closeSheet();return;}
    if(e.key==='/'&&document.activeElement!==qin&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault(); qin.focus();}
  });

  // ── theme
  function curTheme(){var t=document.documentElement.getAttribute('data-theme');return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
  function paintThemeIcon(){$('themeBtn').innerHTML=curTheme()==='dark'?ICON.sun:ICON.moon;}
  $('themeBtn').addEventListener('click',function(){var t=curTheme()==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',t); sset('nipun-theme',t); paintThemeIcon();});
  var th=sget('nipun-theme'); if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th);
  paintThemeIcon();

  render();
})();
</script>

</body>
</html>
